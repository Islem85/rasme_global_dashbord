<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Assistant robot">
  <defs>
    <linearGradient id="bot-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7ECF1"/>
    </linearGradient>
    <linearGradient id="bot-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEFF3"/>
      <stop offset="1" stop-color="#CDD3DA"/>
    </linearGradient>
    <radialGradient id="bot-screen" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#27406A"/>
      <stop offset="0.7" stop-color="#13243C"/>
      <stop offset="1" stop-color="#0B1626"/>
    </radialGradient>
    <radialGradient id="bot-eye" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9CF3FB"/>
      <stop offset="1" stop-color="#3FD7EC"/>
    </radialGradient>
    <filter id="bot-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="189" rx="42" ry="6.5" fill="#0B1626" opacity="0.10"/>

  <!-- arms (behind body) -->
  <g fill="url(#bot-metal)" stroke="#C3CAD2" stroke-width="1">
    <ellipse cx="53" cy="151" rx="12" ry="27" transform="rotate(21 53 151)"/>
    <ellipse cx="147" cy="151" rx="12" ry="27" transform="rotate(-21 147 151)"/>
  </g>

  <!-- neck -->
  <rect x="87" y="97" width="26" height="24" rx="9" fill="url(#bot-metal)" stroke="#C3CAD2" stroke-width="1"/>

  <!-- body -->
  <rect x="56" y="112" width="88" height="74" rx="38" fill="url(#bot-body)" stroke="#D7DDE3" stroke-width="1.6"/>
  <!-- body seam + notch -->
  <path d="M62 150 H92 l4 -7 h8 l4 7 H138" fill="none" stroke="#CED5DC" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- body gloss -->
  <ellipse cx="80" cy="130" rx="17" ry="9" transform="rotate(-28 80 130)" fill="#FFFFFF" opacity="0.55"/>

  <!-- ears -->
  <rect x="33" y="52" width="16" height="30" rx="8" fill="url(#bot-metal)" stroke="#C3CAD2" stroke-width="1"/>
  <rect x="151" y="52" width="16" height="30" rx="8" fill="url(#bot-metal)" stroke="#C3CAD2" stroke-width="1"/>

  <!-- antenna -->
  <rect x="90" y="6" width="20" height="22" rx="10" fill="url(#bot-metal)" stroke="#C3CAD2" stroke-width="1"/>

  <!-- head -->
  <rect x="44" y="20" width="112" height="82" rx="30" fill="url(#bot-body)" stroke="#D7DDE3" stroke-width="1.6"/>
  <!-- head gloss -->
  <ellipse cx="66" cy="33" rx="13" ry="5.5" transform="rotate(-32 66 33)" fill="#FFFFFF" opacity="0.7"/>

  <!-- screen -->
  <rect x="58" y="34" width="84" height="56" rx="22" fill="url(#bot-screen)"/>

  <!-- face: eyes + smile -->
  <g fill="url(#bot-eye)" filter="url(#bot-glow)">
    <path d="M72 64 A12 12 0 0 1 96 64 Z"/>
    <path d="M104 64 A12 12 0 0 1 128 64 Z"/>
    <path d="M89 75 A11 11 0 0 0 111 75 Z"/>
  </g>
</svg>
